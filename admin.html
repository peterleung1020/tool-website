<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 工具制造公司</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 后台管理特定样式 */
        .admin-container {
            max-width: 1200px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }

        .admin-header {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 28px;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .admin-tab {
            padding: 12px 25px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
        }

        .admin-tab:hover,
        .admin-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .admin-section {
            display: none;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .admin-section.active {
            display: block;
        }

        .admin-section h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--dark-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-size: 14px;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #e55a2b;
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--white);
        }

        .btn-secondary:hover {
            background: #003d6b;
        }

        .preview-box {
            margin-top: 20px;
            padding: 20px;
            background: var(--light-color);
            border-radius: 5px;
        }

        .preview-box h3 {
            margin-bottom: 15px;
            color: var(--dark-color);
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            margin-top: 10px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .config-list {
            list-style: none;
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .config-item-info {
            flex: 1;
        }

        .config-item-label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .config-item-value {
            color: #666;
            font-size: 14px;
        }

        .config-item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 12px;
        }

        /* 树形结构样式 */
        .tree-container {
            border: 2px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            background: var(--light-color);
        }

        .tree-item {
            padding: 8px 10px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tree-item:hover {
            background: rgba(255, 107, 53, 0.1);
        }

        .tree-item.selected {
            background: rgba(255, 107, 53, 0.2);
            border-left: 3px solid var(--primary-color);
        }

        .tree-item.category {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .tree-item.product {
            color: var(--text-color);
        }

        .tree-children {
            margin-left: 25px;
            border-left: 2px dashed #ddd;
            padding-left: 10px;
        }

        .tree-icon {
            width: 20px;
            text-align: center;
        }

        .tree-actions {
            margin-left: auto;
            display: none;
            gap: 5px;
        }

        .tree-item:hover .tree-actions {
            display: flex;
        }

        .tree-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            background: var(--white);
            color: var(--text-color);
        }

        .tree-btn:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        .tree-btn.delete:hover {
            background: #dc3545;
        }

        @media (max-width: 768px) {
            .admin-tabs {
                overflow-x: auto;
            }

            .admin-tab {
                white-space: nowrap;
            }

            .config-item {
                flex-direction: column;
                align-items: stretch;
            }

            .config-item-actions {
                margin-top: 10px;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="images/logo.png" alt="Logo">
                <span class="company-name">后台管理</span>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="/"><i class="fas fa-home"></i> 返回首页</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cog"></i> 网站内容管理</h1>
            <p>修改网站显示的内容和配置（数据保存在浏览器本地）</p>

            <div class="admin-tabs">
                <button class="admin-tab active" onclick="showTab('company')">公司信息</button>
                <button class="admin-tab" onclick="showTab('contact')">联系方式</button>
                <button class="admin-tab" onclick="showTab('products')">产品管理</button>
                <button class="admin-tab" onclick="showTab('banners')">轮播图设置</button>
                <button class="admin-tab" onclick="showTab('export')">导出配置</button>
            </div>
        </div>

        <!-- 提示信息 -->
        <div id="alertBox" class="alert"></div>

        <!-- 公司信息 -->
        <section id="companySection" class="admin-section active">
            <h2>公司基本信息</h2>
            <form id="companyForm">
                <div class="form-group">
                    <label>公司名称 *</label>
                    <input type="text" id="companyName" placeholder="请输入公司名称">
                </div>
                <div class="form-group">
                    <label>ICP备案号</label>
                    <input type="text" id="icpNumber" placeholder="浙ICP备XXXXXXXX号-X">
                </div>
                <div class="form-group">
                    <label>公司简介</label>
                    <textarea id="companyDesc" placeholder="请输入公司简介"></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 保存</button>
            </form>

            <div class="preview-box">
                <h3>预览</h3>
                <p><strong>公司名称：</strong><span id="previewCompanyName">-</span></p>
                <p><strong>备案号：</strong><span id="previewIcp">-</span></p>
            </div>
        </section>

        <!-- 联系方式 -->
        <section id="contactSection" class="admin-section">
            <h2>联系方式设置</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label>联系电话 *</label>
                    <input type="tel" id="phoneNumber" placeholder="0579-87228379">
                </div>
                <div class="form-group">
                    <label>联系邮箱</label>
                    <input type="email" id="emailAddress" placeholder="sales@yourcompany.com">
                </div>
                <div class="form-group">
                    <label>联系地址</label>
                    <textarea id="address" placeholder="请输入公司地址"></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 保存</button>
            </form>

            <div class="preview-box">
                <h3>预览</h3>
                <p><strong>电话：</strong><span id="previewPhone">-</span></p>
                <p><strong>邮箱：</strong><span id="previewEmail">-</span></p>
                <p><strong>地址：</strong><span id="previewAddress">-</span></p>
            </div>
        </section>

        <!-- 产品管理 -->
        <section id="productsSection" class="admin-section">
            <h2>产品层级管理</h2>
            
            <!-- 分类和产品树形结构 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <!-- 左侧：树形结构 -->
                <div>
                    <h3>产品分类树</h3>
                    <div class="tree-container" id="categoryTree">
                        <!-- 动态生成树形结构 -->
                    </div>
                    <button class="btn btn-secondary" onclick="addCategory()" style="margin-top: 15px;">
                        <i class="fas fa-folder-plus"></i> 添加分类
                    </button>
                </div>

                <!-- 右侧：产品表单 -->
                <div>
                    <h3>添加/编辑产品</h3>
                    <form id="productForm">
                        <div class="form-group">
                            <label>产品名称 *</label>
                            <input type="text" id="productName" placeholder="请输入产品名称">
                        </div>
                        <div class="form-group">
                            <label>所属分类 *</label>
                            <select id="productCategory">
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>父级产品（可选，用于创建子产品）</label>
                            <select id="parentProduct">
                                <option value="">无（顶级产品）</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>产品描述</label>
                            <textarea id="productDesc" placeholder="请输入产品描述"></textarea>
                        </div>
                        <div class="form-group">
                            <label>产品价格</label>
                            <input type="number" id="productPrice" placeholder="0.00" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>产品图片</label>
                            <input type="file" id="productImage" accept="image/*">
                            <img id="productImagePreview" class="image-preview" style="display:none;">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> 添加产品</button>
                        <button type="button" class="btn btn-secondary" onclick="clearProductForm()"><i class="fas fa-redo"></i> 清空</button>
                    </form>
                </div>
            </div>

            <!-- 产品列表 -->
            <div class="preview-box" style="margin-top: 30px;">
                <h3>所有产品列表（含层级关系）</h3>
                <div id="productsTreeView"></div>
            </div>
        </section>

        <!-- 轮播图设置 -->
        <section id="bannersSection" class="admin-section">
            <h2>轮播图管理</h2>
            <form id="bannerForm">
                <div class="form-group">
                    <label>轮播图标题</label>
                    <input type="text" id="bannerTitle" placeholder="请输入轮播图标题">
                </div>
                <div class="form-group">
                    <label>轮播图描述</label>
                    <textarea id="bannerDesc" placeholder="请输入轮播图描述"></textarea>
                </div>
                <div class="form-group">
                    <label>轮播图序号</label>
                    <select id="bannerIndex">
                        <option value="0">第1张</option>
                        <option value="1">第2张</option>
                        <option value="2">第3张</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>上传图片</label>
                    <input type="file" id="bannerImage" accept="image/*">
                    <img id="bannerImagePreview" class="image-preview" style="display:none;">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 保存轮播图</button>
            </form>
        </section>

        <!-- 导出配置 -->
        <section id="exportSection" class="admin-section">
            <h2>配置导出与导入</h2>
            <div class="form-group">
                <h3>导出配置</h3>
                <p>将所有设置导出为JSON文件，方便备份和迁移。</p>
                <button class="btn btn-primary" onclick="exportConfig()"><i class="fas fa-download"></i> 导出配置文件</button>
            </div>

            <div class="form-group" style="margin-top: 40px;">
                <h3>导入配置</h3>
                <p>从之前导出的JSON文件中恢复配置。</p>
                <input type="file" id="importFile" accept=".json" style="margin-bottom: 15px;">
                <button class="btn btn-secondary" onclick="importConfig()"><i class="fas fa-upload"></i> 导入配置文件</button>
            </div>

            <div class="form-group" style="margin-top: 40px;">
                <h3>重置所有数据</h3>
                <p style="color: #dc3545;">警告：此操作将清除所有本地保存的配置，无法恢复！</p>
                <button class="btn" style="background:#dc3545; color:white;" onclick="resetAllData()"><i class="fas fa-exclamation-triangle"></i> 重置所有数据</button>
            </div>
        </section>
    </div>

    <script>
        // 切换标签页
        function showTab(tabName) {
            // 隐藏所有section
            document.querySelectorAll('.admin-section').forEach(section => {
                section.classList.remove('active');
            });

            // 移除所有tab的active类
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // 显示选中的section
            const sectionMap = {
                'company': 'companySection',
                'contact': 'contactSection',
                'products': 'productsSection',
                'banners': 'bannersSection',
                'export': 'exportSection'
            };

            document.getElementById(sectionMap[tabName]).classList.add('active');

            // 激活当前tab
            event.target.classList.add('active');
        }

        // 显示提示信息
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }

        // 加载已保存的数据
        function loadSavedData() {
            // 公司信息
            const companyName = localStorage.getItem('companyName') || '';
            const icpNumber = localStorage.getItem('icpNumber') || '';
            const companyDesc = localStorage.getItem('companyDesc') || '';

            document.getElementById('companyName').value = companyName;
            document.getElementById('icpNumber').value = icpNumber;
            document.getElementById('companyDesc').value = companyDesc;

            updatePreview('company');

            // 联系方式
            const phone = localStorage.getItem('phoneNumber') || '';
            const email = localStorage.getItem('emailAddress') || '';
            const address = localStorage.getItem('address') || '';

            document.getElementById('phoneNumber').value = phone;
            document.getElementById('emailAddress').value = email;
            document.getElementById('address').value = address;

            updatePreview('contact');
        }

        // 更新预览
        function updatePreview(type) {
            if (type === 'company') {
                document.getElementById('previewCompanyName').textContent =
                    document.getElementById('companyName').value || '-';
                document.getElementById('previewIcp').textContent =
                    document.getElementById('icpNumber').value || '-';
            } else if (type === 'contact') {
                document.getElementById('previewPhone').textContent =
                    document.getElementById('phoneNumber').value || '-';
                document.getElementById('previewEmail').textContent =
                    document.getElementById('emailAddress').value || '-';
                document.getElementById('previewAddress').textContent =
                    document.getElementById('address').value || '-';
            }
        }

        // 保存公司信息
        document.getElementById('companyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            localStorage.setItem('companyName', document.getElementById('companyName').value);
            localStorage.setItem('icpNumber', document.getElementById('icpNumber').value);
            localStorage.setItem('companyDesc', document.getElementById('companyDesc').value);

            updatePreview('company');
            showAlert('公司信息保存成功！');
        });

        // 保存联系方式
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            localStorage.setItem('phoneNumber', document.getElementById('phoneNumber').value);
            localStorage.setItem('emailAddress', document.getElementById('emailAddress').value);
            localStorage.setItem('address', document.getElementById('address').value);

            updatePreview('contact');
            showAlert('联系方式保存成功！');
        });

        // 监听输入变化实时更新预览
        document.getElementById('companyName').addEventListener('input', () => updatePreview('company'));
        document.getElementById('icpNumber').addEventListener('input', () => updatePreview('company'));
        document.getElementById('phoneNumber').addEventListener('input', () => updatePreview('contact'));
        document.getElementById('emailAddress').addEventListener('input', () => updatePreview('contact'));
        document.getElementById('address').addEventListener('input', () => updatePreview('contact'));

        // 导出配置
        function exportConfig() {
            const config = {
                companyName: localStorage.getItem('companyName') || '',
                icpNumber: localStorage.getItem('icpNumber') || '',
                companyDesc: localStorage.getItem('companyDesc') || '',
                phoneNumber: localStorage.getItem('phoneNumber') || '',
                emailAddress: localStorage.getItem('emailAddress') || '',
                address: localStorage.getItem('address') || '',
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `website-config-${new Date().getTime()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            showAlert('配置导出成功！');
        }

        // 导入配置
        function importConfig() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];

            if (!file) {
                showAlert('请选择要导入的文件', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);

                    Object.keys(config).forEach(key => {
                        if (key !== 'exportDate') {
                            localStorage.setItem(key, config[key]);
                        }
                    });

                    loadSavedData();
                    showAlert('配置导入成功！请刷新页面查看效果。');
                } catch (error) {
                    showAlert('文件格式错误', 'error');
                }
            };
            reader.readAsText(file);
        }

        // 重置所有数据
        function resetAllData() {
            if (confirm('确定要重置所有数据吗？此操作不可恢复！')) {
                localStorage.clear();
                showAlert('所有数据已重置，请刷新页面。');
                setTimeout(() => location.reload(), 1500);
            }
        }

        // ========== 产品层级管理功能 ==========
        
        // 产品分类和产品数据结构
        let categories = JSON.parse(localStorage.getItem('categories')) || [
            { id: 'cat_1', name: '新品', type: 'category', children: [] },
            { id: 'cat_2', name: '园林工具', type: 'category', children: [] },
            { id: 'cat_3', name: '电动工具', type: 'category', children: [] },
            { id: 'cat_4', name: '锂电系列', type: 'category', children: [] }
        ];
        
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let selectedCategory = null;

        // 保存分类和产品到LocalStorage
        function saveCategoriesAndProducts() {
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('products', JSON.stringify(products));
        }

        // 渲染分类树
        function renderCategoryTree() {
            const treeContainer = document.getElementById('categoryTree');
            treeContainer.innerHTML = renderTreeItems(categories, 0);
            
            // 绑定点击事件
            document.querySelectorAll('.tree-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('tree-btn')) {
                        document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedCategory = this.dataset.id;
                        updateProductCategorySelect();
                    }
                });
            });
        }

        // 递归渲染树节点
        function renderTreeItems(items, level) {
            let html = '';
            items.forEach(item => {
                const icon = item.type === 'category' ? '<i class="fas fa-folder"></i>' : '<i class="fas fa-box"></i>';
                const indent = level * 25;
                
                html += `
                    <div class="tree-item ${item.type}" data-id="${item.id}" style="padding-left: ${10 + indent}px;">
                        <span class="tree-icon">${icon}</span>
                        <span>${item.name}</span>
                        <div class="tree-actions">
                            ${item.type === 'category' ? `<button class="tree-btn" onclick="addSubCategory('${item.id}')"><i class="fas fa-plus"></i></button>` : ''}
                            <button class="tree-btn delete" onclick="deleteItem('${item.id}', '${item.type}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                
                if (item.children && item.children.length > 0) {
                    html += `<div class="tree-children">${renderTreeItems(item.children, level + 1)}</div>`;
                }
            });
            return html;
        }

        // 添加分类
        function addCategory() {
            const name = prompt('请输入分类名称：');
            if (name && name.trim()) {
                const newCategory = {
                    id: 'cat_' + Date.now(),
                    name: name.trim(),
                    type: 'category',
                    children: []
                };
                categories.push(newCategory);
                saveCategoriesAndProducts();
                renderCategoryTree();
                updateProductCategorySelect();
                showAlert('分类添加成功！');
            }
        }

        // 添加子分类
        function addSubCategory(parentId) {
            const name = prompt('请输入子分类名称：');
            if (name && name.trim()) {
                const parent = findItemById(categories, parentId);
                if (parent) {
                    const newCategory = {
                        id: 'cat_' + Date.now(),
                        name: name.trim(),
                        type: 'category',
                        children: []
                    };
                    parent.children.push(newCategory);
                    saveCategoriesAndProducts();
                    renderCategoryTree();
                    updateProductCategorySelect();
                    showAlert('子分类添加成功！');
                }
            }
        }

        // 删除项目
        function deleteItem(id, type) {
            if (!confirm(`确定要删除这个${type === 'category' ? '分类' : '产品'}吗？`)) return;
            
            if (type === 'category') {
                removeCategory(categories, id);
            } else {
                products = products.filter(p => p.id !== id);
            }
            
            saveCategoriesAndProducts();
            renderCategoryTree();
            renderProductsView();
            updateProductCategorySelect();
            updateParentProductSelect();
            showAlert('删除成功！');
        }

        // 递归查找并删除分类
        function removeCategory(items, id) {
            const index = items.findIndex(item => item.id === id);
            if (index !== -1) {
                items.splice(index, 1);
                return true;
            }
            for (let item of items) {
                if (item.children && removeCategory(item.children, id)) {
                    return true;
                }
            }
            return false;
        }

        // 递归查找项目
        function findItemById(items, id) {
            for (let item of items) {
                if (item.id === id) return item;
                if (item.children) {
                    const found = findItemById(item.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        // 更新产品分类下拉框
        function updateProductCategorySelect() {
            const select = document.getElementById('productCategory');
            select.innerHTML = '<option value="">请选择分类</option>';
            
            function addOptions(items, prefix = '') {
                items.forEach(item => {
                    if (item.type === 'category') {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = prefix + item.name;
                        select.appendChild(option);
                        
                        if (item.children && item.children.length > 0) {
                            addOptions(item.children, prefix + '  ');
                        }
                    }
                });
            }
            
            addOptions(categories);
        }

        // 更新父级产品下拉框
        function updateParentProductSelect() {
            const select = document.getElementById('parentProduct');
            select.innerHTML = '<option value="">无（顶级产品）</option>';
            
            products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = product.name;
                select.appendChild(option);
            });
        }

        // 渲染产品视图（含层级）
        function renderProductsView() {
            const container = document.getElementById('productsTreeView');
            
            if (products.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无产品</p>';
                return;
            }
            
            // 构建树形结构
            const topLevelProducts = products.filter(p => !p.parentId);
            let html = '<ul style="list-style: none; padding: 0;">';
            
            topLevelProducts.forEach(product => {
                html += renderProductItem(product, 0);
            });
            
            html += '</ul>';
            container.innerHTML = html;
        }

        // 渲染单个产品项（递归）
        function renderProductItem(product, level) {
            const indent = level * 30;
            const children = products.filter(p => p.parentId === product.id);
            
            let html = `
                <li style="margin: 10px 0;">
                    <div style="padding: 10px; background: white; border: 1px solid #ddd; border-radius: 4px; margin-left: ${indent}px;">
                        <strong>${product.name}</strong>
                        <span style="color: #666; margin-left: 10px;">分类: ${getCategoryName(product.categoryId)}</span>
                        <span style="color: #ff6b35; margin-left: 10px;">¥${product.price || '0.00'}</span>
                        ${children.length > 0 ? `<span style="color: #999; margin-left: 10px;">(${children.length}个子产品)</span>` : ''}
                        <div style="float: right;">
                            <button class="btn btn-small btn-secondary" onclick="editProduct('${product.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-small" style="background:#dc3545; color:white;" onclick="deleteItem('${product.id}', 'product')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
            `;
            
            if (children.length > 0) {
                html += '<ul style="list-style: none; padding: 0; margin-top: 10px;">';
                children.forEach(child => {
                    html += renderProductItem(child, level + 1);
                });
                html += '</ul>';
            }
            
            html += '</li>';
            return html;
        }

        // 获取分类名称
        function getCategoryName(categoryId) {
            const category = findItemById(categories, categoryId);
            return category ? category.name : '未分类';
        }

        // 添加产品表单提交
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('productName').value.trim();
            const categoryId = document.getElementById('productCategory').value;
            const parentId = document.getElementById('parentProduct').value;
            const desc = document.getElementById('productDesc').value.trim();
            const price = document.getElementById('productPrice').value;
            
            if (!name) {
                showAlert('请输入产品名称', 'error');
                return;
            }
            
            if (!categoryId) {
                showAlert('请选择产品分类', 'error');
                return;
            }
            
            const newProduct = {
                id: 'prod_' + Date.now(),
                name: name,
                categoryId: categoryId,
                parentId: parentId || null,
                description: desc,
                price: price || '0.00',
                image: '',
                createdAt: new Date().toISOString()
            };
            
            products.push(newProduct);
            saveCategoriesAndProducts();
            
            clearProductForm();
            renderProductsView();
            updateParentProductSelect();
            showAlert('产品添加成功！');
        });

        // 清空产品表单
        function clearProductForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('parentProduct').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('productImagePreview').style.display = 'none';
        }

        // 编辑产品
        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.categoryId;
            document.getElementById('parentProduct').value = product.parentId || '';
            document.getElementById('productDesc').value = product.description || '';
            document.getElementById('productPrice').value = product.price;
            
            // 滚动到表单顶部
            document.getElementById('productForm').scrollIntoView({ behavior: 'smooth' });
            
            showAlert('已加载产品信息，修改后点击"添加产品"保存', 'success');
        }

        // 图片预览
        document.getElementById('productImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('productImagePreview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 页面加载时初始化产品管理
        function initProductManagement() {
            renderCategoryTree();
            renderProductsView();
            updateProductCategorySelect();
            updateParentProductSelect();
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            loadSavedData();
            initProductManagement();
        });
    </script>
</body>
</html>
